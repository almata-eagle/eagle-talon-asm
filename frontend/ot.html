<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Eagle Talon OT</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  /* Same tokens as Talon (index.html). No CDN: this page must work offline. */
  :root{
    --font-display:'Space Grotesk','Noto Sans JP',system-ui,sans-serif;
    --font-body:'Inter','Noto Sans JP',system-ui,sans-serif;
    --font-mono:'JetBrains Mono','Noto Sans JP',ui-monospace,monospace;
  }
  html[data-theme="dark"]{
    --bg:#0B0F14; --panel:#121821; --panel-2:#161d27; --line:#232B36; --line-soft:#1a212b;
    --text:#E7EDF3; --muted:#7C8B9C; --dim:#4b5866;
    --clear:#3DDC84; --watch:#F2B84B; --high:#FF6B4A; --critical:#E23D5C; --signal:#5EEAD4;
    --overlay:rgba(0,0,0,.55);
  }
  html[data-theme="light"]{
    --bg:#F3F5F7; --panel:#FFFFFF; --panel-2:#F3F5F8; --line:#DEE3E9; --line-soft:#E9ECF0;
    --text:#141A21; --muted:#5B6B7C; --dim:#93A0AC;
    --clear:#1E9E5A; --watch:#B8790F; --high:#D14B26; --critical:#C21F45; --signal:#0E8E82;
    --overlay:rgba(20,26,33,.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; min-height:100vh;}
  button,input,select,textarea{font:inherit; color:inherit;}
  a{color:var(--signal);}
  .mono{font-family:var(--font-mono); font-size:12px;}
  .muted{color:var(--muted);} .dim{color:var(--dim);}
  [hidden]{display:none !important;}

  .topbar{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:20; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; letter-spacing:.06em;}
  .brand img{width:24px; height:24px;}
  .brand .sub{font-weight:500; letter-spacing:0; color:var(--muted); font-size:12.5px;}
  .chip{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); font-size:11.5px; color:var(--muted); white-space:nowrap;}
  .spacer{flex:1;}
  .toggle{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .toggle button{background:transparent; border:0; padding:5px 10px; cursor:pointer; color:var(--muted); font-size:12.5px;}
  .toggle button.active{background:var(--panel-2); color:var(--text);}
  .btn{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; white-space:nowrap;}
  .btn:hover{border-color:var(--signal);}
  .btn.primary{background:var(--signal); color:#05201c; border-color:var(--signal); font-weight:600;}
  .btn.danger{color:var(--critical);}
  .btn.small{padding:3px 8px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:default;}

  .layout{display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 53px);}
  .side{border-right:1px solid var(--line); padding:14px; display:flex; flex-direction:column; gap:10px;}
  .side h3{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .navItem{display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; border-radius:8px; padding:8px 10px; cursor:pointer;}
  .navItem:hover{background:var(--panel-2);}
  .navItem.active{background:var(--panel-2); border-color:var(--line);}
  .navItem .t{font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .navItem .s{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .main{padding:20px 24px 60px; min-width:0;}
  h1{font-family:var(--font-display); font-size:22px; font-weight:600;}
  h2{font-family:var(--font-display); font-size:16px; font-weight:600; margin:22px 0 10px;}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px;}
  .kv{display:grid; grid-template-columns:140px 1fr; gap:6px 12px; font-size:13px;}
  .kv dt{color:var(--muted);}
  .bar{display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--line-soft); margin:10px 0 6px;}
  .bar span{display:block; height:100%;}
  .legend{display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--muted);}
  .legend i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:0;}
  .st-implemented{--c:var(--clear);} .st-partial{--c:var(--watch);} .st-not_implemented{--c:var(--high);}
  .st-inherited{--c:var(--signal);} .st-na{--c:var(--dim);} .st-impractical{--c:#a78bfa;} .st-not_assessed{--c:var(--line);}
  .pill{display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; border:1px solid var(--c,var(--line)); color:var(--c,var(--muted)); white-space:nowrap;}
  .st-not_assessed.pill{color:var(--muted);}
  .sev-critical{--c:var(--critical);} .sev-high{--c:var(--high);} .sev-moderate{--c:var(--watch);} .sev-low{--c:var(--muted);}
  .cia{display:inline-flex; gap:4px;}
  .cia b{font-family:var(--font-mono); font-size:11px; padding:1px 6px; border-radius:4px; background:var(--panel-2); border:1px solid var(--line); font-weight:500;}
  .cia b.high{color:var(--high);} .cia b.moderate{color:var(--watch);} .cia b.low{color:var(--clear);}

  table{border-collapse:collapse; width:100%;}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; font-size:13px;}
  th{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--bg); z-index:1;}
  tbody tr.click{cursor:pointer;} tbody tr.click:hover{background:var(--panel-2);}
  tr.sel{background:var(--panel-2);}
  td.req{max-width:520px;}
  td.req div{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tableWrap{overflow:auto; max-height:calc(100vh - 140px);}

  label.f{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted);}
  input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],select,textarea{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:7px 9px; color:var(--text); font-size:13px; width:100%;}
  textarea{min-height:70px; resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--signal);}
  .form{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px;}
  .form .wide{grid-column:1/-1;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0;}
  .filters select,.filters input{width:auto; min-width:140px;}

  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(620px,100vw); background:var(--panel); border-left:1px solid var(--line); z-index:40; overflow-y:auto; padding:18px 20px 40px; box-shadow:-30px 0 60px rgba(0,0,0,.3);}
  .modalBack{position:fixed; inset:0; background:var(--overlay); z-index:30;}
  .modal{position:fixed; top:5vh; left:50%; transform:translateX(-50%); width:min(980px,96vw); max-height:90vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; z-index:50; padding:18px 20px;}
  .closeX{float:right; background:none; border:0; font-size:20px; cursor:pointer; color:var(--muted);}
  .src{font-size:12px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--panel-2);}
  .src div{display:grid; grid-template-columns:150px 1fr; gap:8px; padding:2px 0;}
  .src div b{color:var(--muted); font-weight:500; overflow-wrap:anywhere;}
  .src div span{overflow-wrap:anywhere; white-space:pre-wrap;}
  .ev{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px;}
  .ev .n{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.3); max-width:90vw;}
  .toast.err{border-color:var(--critical); color:var(--critical);}
  .auth{max-width:420px; margin:10vh auto; }
  .auth .card{padding:24px;}
  .note{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .banner{font-size:12px; border:1px dashed var(--line); border-radius:8px; padding:8px 10px; color:var(--muted);}
  .marking{text-align:center; font-weight:700; letter-spacing:.08em; font-size:12px; padding:4px; border:1px solid var(--line); border-radius:6px; margin-bottom:10px;}
  .empty{padding:30px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:12px;}
  .mapTable td,.mapTable th{font-size:12px; padding:4px 6px; white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis;}
  .mapTable th{position:static;}
  .mapTable th.mapped{color:var(--signal);}

  /* Printable report */
  .report{max-width:960px;}
  .report h1{font-size:20px;}
  .report table th{position:static;}
  @media print{
    html,body{background:#fff !important; color:#000 !important;}
    html[data-theme]{--text:#000; --muted:#444; --dim:#666; --line:#bbb; --line-soft:#ddd; --panel:#fff; --panel-2:#fff; --bg:#fff;
      --clear:#1E7A47; --watch:#8A5A00; --high:#B23A1B; --critical:#A0102F; --signal:#0B6E65;}
    .report{max-width:none;}
    .report th,.report td{font-size:11px; padding:4px 5px;}
    .bar,.legend i,.bar span{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .topbar,.side,.noprint,.toast{display:none !important;}
    .layout{display:block;}
    .main{padding:0;}
    .report .card{break-inside:avoid; border-color:#bbb;}
    th{position:static;}
    .marking{border-color:#000;}
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .side{border-right:0; border-bottom:1px solid var(--line);}
    .main{padding:16px;}
    .kv{grid-template-columns:110px 1fr;}
  }
</style>
</head>
<body>

<div class="topbar" id="topbar" hidden>
  <div class="brand"><img src="logo-icon.png" alt="">EAGLE TALON <span class="chip" style="color:var(--signal); border-color:var(--signal);">OT</span> <span class="sub" data-t="tagline">Control-system security assessments</span></div>
  <div class="spacer"></div>
  <a class="btn small" id="talonLink" href="index.html" hidden data-t="back_talon">← Talon</a>
  <span class="chip" id="whoChip"></span>
  <div class="toggle"><button id="lang-en" class="active">EN</button><button id="lang-ja">日本語</button></div>
  <button class="btn small" id="themeBtn" title="Light / dark">◐</button>
  <button class="btn small" id="logoutBtn" data-t="logout">Log out</button>
</div>

<div id="authView" class="auth" hidden></div>

<div class="layout" id="appView" hidden>
  <aside class="side">
    <div class="row" style="justify-content:space-between;"><h3 data-t="engagements">Engagements</h3>
      <button class="btn small" id="newEngBtn" data-role="edit" data-t="new">+ New</button></div>
    <div id="engList"></div>
    <div data-role="admin" style="margin-top:auto; display:flex; flex-direction:column; gap:4px;">
      <h3 data-t="admin">Admin</h3>
      <button class="navItem" data-nav="users"><div class="t" data-t="users">Users</div></button>
      <button class="navItem" data-nav="audit"><div class="t" data-t="audit">Audit log</div></button>
    </div>
    <button class="navItem" data-nav="help"><div class="t" data-t="help">How this works</div></button>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="overlay"></div>

function tf(k, vars){ let s = t(k); Object.entries(vars||{}).forEach(([a,b])=>{ s = s.split('{'+a+'}').join(String(b)); }); return s; }
function L(group, code){ if(code==null || code==='') return t('none'); return (LABELS[LANG][group]||{})[code] ?? (LABELS.en[group]||{})[code] ?? code; }
function escH(v){ return String(v ?? '').replace(/[&<>"'`]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c])); }
function $(s, el=document){ return el.querySelector(s); }
function $$(s, el=document){ return [...el.querySelectorAll(s)]; }
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function sstore(k, v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); }catch(e){ return null; } }
function fmtDate(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleString(LANG==='ja'?'ja-JP':undefined, {dateStyle:'medium', timeStyle:'short'}); }catch(e){ return iso; } }
function fmtSize(n){ return n>1048576 ? (n/1048576).toFixed(1)+' MB' : n>1024 ? Math.round(n/1024)+' KB' : n+' B'; }

// ------------------------------------------------------------------ state + API
const S = { token: sstore('ot_token'), me:null, meta:null, engagements:[], eng:null, sys:null, items:[], filters:{status:'',category:'',level:'',q:''}, view:'home', itemId:null };
const API = 'api/ot';
class ApiError extends Error { constructor(status, msg){ super(msg); this.status = status; } }

async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers||{});
  if(S.token) headers['Authorization'] = 'Bearer ' + S.token;
  let body = opts.body;
  if(body && !(body instanceof FormData) && typeof body !== 'string'){ body = JSON.stringify(body); headers['Content-Type'] = 'application/json'; }
  let r;
  try{ r = await fetch(API + path, {method: opts.method || (body ? 'POST' : 'GET'), headers, body}); }
  catch(e){ throw new ApiError(0, t('err_net')); }
  if(r.status === 401 && path !== '/login' && path !== '/setup'){ endSession(t('session_over')); throw new ApiError(401, t('session_over')); }
  if(opts.raw){ if(!r.ok) throw new ApiError(r.status, await errText(r)); return r; }
  if(!r.ok) throw new ApiError(r.status, await errText(r));
  return r.json();
}
async function errText(r){
  try{ const j = await r.json(); if(typeof j.detail === 'string') return j.detail; if(Array.isArray(j.detail)) return j.detail.map(d=>d.msg).join('; '); }catch(e){}
  return 'HTTP ' + r.status;
}
function toast(msg, err){
  $$('.toast').forEach(x=>x.remove());
  const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), err ? 6000 : 2500);
}
async function guarded(fn){ try{ return await fn(); }catch(e){ if(e.status !== 401) toast(e.message || String(e), true); } }
const canEdit = ()=> S.me && (S.me.role === 'admin' || S.me.role === 'assessor');
const isAdmin = ()=> S.me && S.me.role === 'admin';

async function download(path, fallbackName){
  const r = await api(path, {raw:true});
  const blob = await r.blob();
  const cd = r.headers.get('Content-Disposition') || '';
  let name = fallbackName;
  const m = cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="([^"]+)"/i);
  if(m){ try{ name = decodeURIComponent(m[1]); }catch(e){ name = m[1]; } }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

// ------------------------------------------------------------------ auth
function endSession(msg){
  S.token = null; S.me = null; sstore('ot_token', null);
  closeOverlay(); showAuth(msg);
}
async function showAuth(msg){
  $('#topbar').hidden = false; $('#appView').hidden = true; $('#authView').hidden = false;
  $('#whoChip').hidden = true; $('#logoutBtn').hidden = true;
  const v = $('#authView');
  if(!S.meta){
    try{ S.meta = await api('/status'); }
    catch(e){ v.innerHTML = `<div class="card"><h1>Talon OT</h1><p class="note" style="margin-top:10px;">${escH(e.status===404 ? t('ot_off') : e.message)}</p></div>`; return; }
  }
  const setup = !S.meta.users_exist;
  v.innerHTML = `<div class="card">
    <h1>${escH(t(setup ? 'setup_h' : 'login_h'))}</h1>
    ${setup ? `<p class="note" style="margin:8px 0 0;">${escH(t('setup_p'))}</p>` : ''}
    ${msg ? `<p class="note" style="margin-top:8px; color:var(--watch);">${escH(msg)}</p>` : ''}
    <form id="authForm" style="display:flex; flex-direction:column; gap:12px; margin-top:16px;">
      <label class="f">${escH(t('username'))}<input type="text" name="username" autocomplete="username" required minlength="3" maxlength="40"></label>
      <label class="f">${escH(t('password'))}<input type="password" name="password" autocomplete="${setup?'new-password':'current-password'}" required ${setup?'minlength="12"':''}>
        ${setup ? `<span class="dim">${escH(t('pw_rule'))}</span>` : ''}</label>
      ${setup && S.meta.setup_code_required ? `<label class="f">${escH(t('setup_code'))}<input type="password" name="code" required><span class="dim">${escH(t('setup_code_p'))}</span></label>` : ''}
      <button class="btn primary" type="submit">${escH(t(setup ? 'create_admin' : 'login'))}</button>
    </form></div>`;
  $('#authForm').onsubmit = async ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const body = {username: f.get('username').trim(), password: f.get('password'), code: f.get('code') || null};
    await guarded(async ()=>{
      const r = await api(setup ? '/setup' : '/login', {body});
      S.token = r.token; sstore('ot_token', r.token);
      S.meta.users_exist = true;
      await start();
    });
  };
  setTimeout(()=>{ const u = $('#authForm input[name=username]'); if(u) u.focus(); }, 0);
}
$('#logoutBtn').onclick = async ()=>{ try{ await api('/logout', {method:'POST'}); }catch(e){} endSession(); };

async function start(){
  try{ S.meta = S.meta || await api('/status'); }catch(e){ return showAuth(); }
  if(!S.token) return showAuth();
  try{ S.me = await api('/me'); }catch(e){ return; }
  $('#authView').hidden = true; $('#appView').hidden = false; $('#topbar').hidden = false;
  $('#logoutBtn').hidden = false; $('#whoChip').hidden = false;
  $('#whoChip').textContent = S.me.username + ' · ' + L('role', S.me.role);
  $$('[data-role=admin]').forEach(el=> el.hidden = !isAdmin());
  $$('[data-role=edit]').forEach(el=> el.hidden = !canEdit());
  await loadEngagements();
  route();
}

function go(hash){ if(location.hash === hash) route(); else location.hash = hash; }
window.addEventListener('hashchange', ()=>{ if(S.me) route(); });
async function route(){
  closeOverlay();
  const h = location.hash.replace(/^#\/?/, '').split('/');
  await guarded(async ()=>{
    if(h[0] === 'e' && h[1]){ await openEngagement(+h[1], h[2] === 'report'); }
    else if(h[0] === 's' && h[1]){ await openSystem(+h[1]); }
    else if(h[0] === 'users' && isAdmin()){ S.view = 'users'; await renderUsers(); }
    else if(h[0] === 'audit' && isAdmin()){ S.view = 'audit'; await renderAudit(); }
    else if(h[0] === 'help'){ S.view = 'help'; renderHelp(); }
    else { S.view = 'home'; S.eng = null; renderHome(); }
  });
  renderSide();
}
function render(){ renderSide(); route(); }

async function viewEvidence(e){
  if(!(e.mime && e.mime.startsWith('image/'))) return download(`/evidence/${e.id}/file`, e.filename);
  const r = await api(`/evidence/${e.id}/file`, {raw:true});
  const url = URL.createObjectURL(await r.blob());
  const back = document.createElement('div'); back.className = 'modalBack'; back.style.zIndex = 55;
  const box = document.createElement('div'); box.className = 'modal'; box.style.zIndex = 56;
  const cap = document.createElement('p'); cap.className = 'note'; cap.textContent = e.filename + ' · SHA-256 ' + e.sha256;
  const img = document.createElement('img'); img.src = url; img.alt = e.filename; img.style.cssText = 'max-width:100%; display:block; margin-top:10px;';
  box.append(cap, img);
  const close = ()=>{ back.remove(); box.remove(); URL.revokeObjectURL(url); };
  back.onclick = close; box.onclick = close;
  document.body.append(back, box);
}

function importWizard(){
  const md = modal(`<h2 style="margin-top:0;">${escH(t('imp_h'))}</h2><p class="note">${escH(t('imp_p'))}</p>
    <label class="f" style="margin-top:12px; max-width:420px;">${escH(t('imp_file'))}<input type="file" id="impFile" accept=".xlsx,.xlsm,.csv"></label>
    <div id="impBody"></div>`);
  $('#impFile', md).onchange = ev=> guarded(async ()=>{
    const file = ev.target.files[0]; if(!file) return;
    const fd = new FormData(); fd.append('file', file);
    $('#impBody', md).innerHTML = '<p class="note" style="margin-top:12px;">…</p>';
    const prev = await api('/import/preview', {body: fd});
    importStep(md, prev);
  });
}
function importStep(md, prev){
  const st = {sheet: 0, header: prev.sheets[0]?.header_row || 0, mapping: Object.assign({}, prev.sheets[0]?.mapping || {}), rows: null};
  // The server previews ~7 sample rows around its guessed header; changing the header row re-reads from those rows.
  const draw = ()=>{
    const sh = prev.sheets[st.sheet];
    const all = [...(sh.top||[]).slice(0, -1), sh.headers, ...(sh.sample||[])];
    const topCount = Math.max(0, (sh.top||[]).length - 1), offset = sh.header_row - topCount;
    const hdrIdx = st.header - offset;
    const headers = all[hdrIdx] || [];
    const sample = all.slice(hdrIdx + 1, hdrIdx + 6);
    const total = Math.max(0, sh.rows_total + (sh.header_row - st.header));
    const mapped = new Set(Object.values(st.mapping).filter(v=>v!=null).map(Number));
    const colOpts = cur=> `<option value="">${escH(t('imp_unmapped'))}</option>` + headers.map((h,i)=>`<option value="${i}" ${String(cur)===String(i)?'selected':''}>${escH(String.fromCharCode(65 + (i%26)) + (i>=26?Math.floor(i/26):''))} · ${escH((h||'').slice(0,40))}</option>`).join('');
    $('#impBody', md).innerHTML = `
      <div class="form" style="margin-top:14px;">
        <label class="f">${escH(t('imp_sheet'))}<select id="impSheet">${prev.sheets.map((s,i)=>`<option value="${i}" ${i===st.sheet?'selected':''}>${escH(s.name)} (${s.rows_total})</option>`).join('')}</select></label>
        <label class="f">${escH(t('imp_header'))}<input type="number" id="impHeader" min="${offset+1}" max="${offset+all.length}" value="${st.header+1}"></label>
      </div>
      <p class="note" style="margin-top:8px;">${escH(t('imp_hint'))}</p>
      <h2>${escH(t('imp_map'))}</h2>
      <div class="form">${S.meta.fields.map(f=>`<label class="f">${escH(t('f_'+f))}<select data-map="${f}">${colOpts(st.mapping[f])}</select></label>`).join('')}</div>
      <h2>${escH(t('imp_sample'))}</h2>
      <div class="tableWrap"><table class="mapTable"><thead><tr>${headers.map((h,i)=>`<th class="${mapped.has(i)?'mapped':''}" title="${escH(h)}">${escH(h || '#'+(i+1))}</th>`).join('')}</tr></thead>
        <tbody>${sample.map(r=>`<tr>${headers.map((_,i)=>`<td title="${escH(r[i])}">${escH(r[i] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="row" style="justify-content:space-between; margin-top:14px;">
        <span class="note">${escH(tf('imp_rows', {n: total, sys: S.sys.name}))}</span>
        <span class="row"><button class="btn" id="impCancel">${escH(t('cancel'))}</button>
        <button class="btn primary" id="impGo" ${total && headers.length ? '' : 'disabled'}>${escH(tf('imp_go', {n: total}))}</button></span></div>`;
    $('#impSheet', md).onchange = ev=>{ st.sheet = +ev.target.value; const s2 = prev.sheets[st.sheet]; st.header = s2.header_row; st.mapping = Object.assign({}, s2.mapping); draw(); };
    $('#impHeader', md).onchange = ev=>{ const v = (+ev.target.value) - 1; if(v - offset >= 0 && v - offset < all.length){ st.header = v; st.mapping = {}; draw(); } };
    $$('[data-map]', md).forEach(sel=> sel.onchange = ()=>{ const v = sel.value; if(v === '') delete st.mapping[sel.dataset.map]; else st.mapping[sel.dataset.map] = +v; draw(); });
    $('#impCancel', md).onclick = closeOverlay;
    $('#impGo', md).onclick = ()=> guarded(async ()=>{
      $('#impGo', md).disabled = true;
      const r = await api(`/systems/${S.sys.id}/import`, {body:{upload_id: prev.upload_id, sheet: sh.name, header_row: st.header, mapping: st.mapping}});
      closeOverlay(); toast(tf('imp_done', {n: r.imported})); await loadEngagements(); await openSystem(S.sys.id);
    });
  };
  draw();
}

        ${S.meta.statuses.map(k=>`<td>${s.counts[k]||''}</td>`).join('')}<td>${Object.values(s.counts).reduce((a,b)=>a+b,0)}</td></tr>`).join('')}</tbody></table></div>
    ${r.systems.map(s=>`<h2>${escH(s.name)} — ${escH(t('open_items'))}</h2>
      ${s.impact_set_by ? `<p class="note">${escH(t('impact_set_by'))}: ${escH(s.impact_set_by)}</p>` : ''}
      ${s.open_items.length ? `<div class="card" style="padding:4px 8px;"><table><thead><tr><th>${escH(t('f_ref'))}</th><th>${escH(t('f_finding'))}</th><th>${escH(t('f_severity'))}</th><th>${escH(t('f_remediation'))}</th><th>${escH(t('f_owner'))}</th><th>${escH(t('f_due_date'))}</th></tr></thead>
        <tbody>${s.open_items.map(i=>`<tr><td class="mono">${escH(i.ref||'')}<br><span class="muted">${escH(i.control||'')}</span><br><span class="pill st-${escH(i.status)}">${escH(L('status', i.status))}</span></td>
          <td style="white-space:pre-wrap;">${escH(i.finding || i.requirement || '')}</td><td>${i.severity ? `<span class="pill sev-${escH(i.severity)}">${escH(L('severity', i.severity))}</span>` : '—'}</td>
          <td style="white-space:pre-wrap;">${escH(i.remediation||'')}</td><td>${escH(i.owner||'')}</td><td class="mono">${escH(i.due_date||'')}</td></tr>`).join('')}</tbody></table></div>`
        : `<p class="note">${escH(t('no_open'))}</p>`}`).join('')}
    <div style="margin-top:24px;">${mark}</div>
    <p class="note">Eagle Talon OT · ${escH(r.generated_at)}</p></div>`;
  $('#repBack').onclick = ()=> go('#/e/' + eid);
  $('#repPrint').onclick = ()=> window.print();
}

// ------------------------------------------------------------------ users + audit (admin)
async function renderUsers(){
  const r = await api('/users'), m = $('#main');
  m.innerHTML = `<h1>${escH(t('users_h'))}</h1>
    <div class="card" style="margin-top:16px;"><table><thead><tr><th>${escH(t('username'))}</th><th>${escH(t('role'))}</th><th></th><th></th></tr></thead>
    <tbody>${r.users.map(u=>`<tr><td>${escH(u.username)}${u.disabled ? ` <span class="chip">${escH(t('disabled'))}</span>` : ''}<br><span class="dim">${escH(fmtDate(u.created_at))}</span></td>
      <td><select data-role-of="${escH(u.username)}" style="width:auto;" ${u.username===S.me.username?'disabled':''}>${opts('role', S.meta.roles, u.role)}</select></td>
      <td><button class="btn small" data-pw="${escH(u.username)}">${escH(t('reset_pw'))}</button></td>
      <td>${u.username===S.me.username ? '' : `<button class="btn small ${u.disabled?'':'danger'}" data-dis="${escH(u.username)}" data-v="${u.disabled?0:1}">${escH(t(u.disabled?'enable':'disable'))}</button>`}</td></tr>`).join('')}</tbody></table></div>
    <h2>${escH(t('add_user'))}</h2>
    <form id="userForm" class="card form">
      <label class="f">${escH(t('username'))}<input type="text" name="username" required minlength="3" maxlength="40" autocomplete="off"></label>
      <label class="f">${escH(t('password'))}<input type="password" name="password" required minlength="12" autocomplete="new-password"></label>
      <label class="f">${escH(t('role'))}<select name="role">${opts('role', S.meta.roles, 'assessor')}</select></label>
      <div class="row" style="align-items:flex-end;"><button class="btn primary" type="submit">${escH(t('create'))}</button></div>
      <ul class="note wide" style="padding-left:18px;"><li>${escH(t('role_admin'))}</li><li>${escH(t('role_assessor'))}</li><li>${escH(t('role_viewer'))}</li></ul>
    </form>`;
  $$('[data-role-of]', m).forEach(s=> s.onchange = ()=> guarded(async ()=>{ await api('/users/' + encodeURIComponent(s.dataset.roleOf), {method:'PATCH', body:{role:s.value}}); toast(t('saved')); }));
  $$('[data-dis]', m).forEach(b=> b.onclick = ()=> guarded(async ()=>{ await api('/users/' + encodeURIComponent(b.dataset.dis), {method:'PATCH', body:{disabled: b.dataset.v === '1'}}); renderUsers(); }));
  $$('[data-pw]', m).forEach(b=> b.onclick = ()=> guarded(async ()=>{
    const pw = prompt(tf('new_pw_q', {u: b.dataset.pw})); if(!pw) return;
    await api('/users/' + encodeURIComponent(b.dataset.pw), {method:'PATCH', body:{password: pw}}); toast(t('saved'));
    if(b.dataset.pw === S.me.username) endSession();
  }));
  $('#userForm').onsubmit = ev=>{ ev.preventDefault(); guarded(async ()=>{
    const f = new FormData(ev.target);
    await api('/users', {body:{username: f.get('username').trim(), password: f.get('password'), role: f.get('role')}});
    renderUsers();
  }); };
}
async function renderAudit(){
  const r = await api('/audit?limit=500'), m = $('#main');
  m.innerHTML = `<h1>${escH(t('audit_h'))}</h1><div class="tableWrap" style="margin-top:16px;"><table><thead><tr>
    <th>${escH(t('at'))}</th><th>${escH(t('actor'))}</th><th>${escH(t('action'))}</th><th>${escH(t('object'))}</th><th>${escH(t('detail'))}</th></tr></thead>
    <tbody>${r.audit.map(a=>`<tr><td class="mono" style="white-space:nowrap;">${escH(fmtDate(a.at))}</td><td>${escH(a.actor)}</td><td class="mono">${escH(a.action)}</td>
      <td class="mono">${escH(a.object_type)} ${escH(a.object_id)}</td><td class="mono" style="max-width:420px; overflow-wrap:anywhere;">${escH(a.detail === '{}' ? '' : a.detail)}</td></tr>`).join('')}</tbody></table></div>`;
}

// ------------------------------------------------------------------ boot
(async function boot(){
  setTheme(store('ot_theme') || 'dark');
  LANG = store('ot_lang') || ((navigator.language||'').startsWith('ja') ? 'ja' : 'en');
  $('#lang-en').classList.toggle('active', LANG==='en'); $('#lang-ja').classList.toggle('active', LANG==='ja');
  document.documentElement.lang = LANG;
  $$('[data-t]').forEach(el=>{ el.textContent = t(el.dataset.t); });
  // Inside Talon there is a way back; the standalone OT server has no /api/version.
  fetch('api/version').then(r=>{ if(r.ok) $('#talonLink').hidden = false; }).catch(()=>{});
  if(S.token) await start(); else await showAuth();
})();
</script>
