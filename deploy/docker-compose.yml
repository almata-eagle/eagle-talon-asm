version: "3.9"

# Shared-host settings: everything is namespaced under "eagle-talon-*" so it
# can't collide with other services' container/network names, and ports are
# read from .env (copy .env.example -> .env and set free ports) rather than
# hardcoded, since 80/8000 are very likely already taken on a shared box.
#
# The api container has NO published port by default — it's only reachable
# from the web container over the internal eagle-talon network. Only nginx
# is exposed to the host. Uncomment api's ports: below only if you need to
# hit the API directly for debugging.

services:
  api:
    build: ../backend
    container_name: eagle-talon-api
    restart: unless-stopped
    networks: [eagle-talon-net]
    # ports:
    #   - "${EAGLE_TALON_API_PORT:-8010}:8000"   # debugging only

  web:
    image: nginx:alpine
    container_name: eagle-talon-web
    restart: unless-stopped
    ports:
      - "${EAGLE_TALON_WEB_PORT:-8088}:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks: [eagle-talon-net]

networks:
  eagle-talon-net:
    name: eagle-talon-net
