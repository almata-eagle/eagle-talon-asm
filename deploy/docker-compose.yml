name: eagle-talon

# Both services run on the HOST's network directly (network_mode: host).
# This box has Tailscale managing netfilter rules in a way that excludes
# Docker's usual bridge-NAT rule, so bridge-networked containers have no
# internet egress, and host.docker.internal resolves to the *default*
# bridge's gateway rather than any custom network's. Host networking
# sidesteps both problems: no bridge, no NAT dependency, nginx just talks
# to localhost directly, same as any two processes on this box.
# (This is the configuration actually running on core — confirmed working.)
#
# ENVIRONMENTS
# Every name, port and volume below comes from an env file, and every default
# is the PRODUCTION value — so running this file with no env file (or with
# env/prod.env) behaves exactly as prod always has. Staging is the same file
# driven by env/staging.env. Always deploy through deploy/deploy.sh, which
# picks the env file and the compose project name (-p) for you.
# See docs/RUNBOOK.md.

services:
  api:
    build:
      context: ../backend
      network: host
    image: ${STACK_NAME:-eagle-talon}-api
    container_name: ${STACK_NAME:-eagle-talon}-api
    restart: unless-stopped
    network_mode: host
    volumes:
      - eagle-talon-data:/app/data
      # SOC hot store, READ-ONLY (Events view). Unset = an empty placeholder
      # folder, so the Events view just says "not connected".
      - ${SOC_HOT_DIR:-../soc/no-hot-store}:/soc-hot:ro
    environment:
      - EAGLE_TALON_DB_PATH=/app/data/eagle_talon.db
      - NVD_API_KEY=${NVD_API_KEY:-}
      - EAGLE_TALON_ENV=${EAGLE_TALON_ENV:-prod}
      - EAGLE_TALON_VERSION=${EAGLE_TALON_VERSION:-unknown}
      - EAGLE_TALON_GIT_SHA=${EAGLE_TALON_GIT_SHA:-unknown}
      - EAGLE_TALON_SCHEDULER=${EAGLE_TALON_SCHEDULER:-on}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - SOC_HOT_DIR_IN_CONTAINER=/soc-hot
      # SOC Phase 2: detection loop + Claude triage. Prod defaults are OFF.
      - SOC_DETECT=${SOC_DETECT:-off}
      - SOC_DETECT_INTERVAL_S=${SOC_DETECT_INTERVAL_S:-300}
      - SOC_TRIAGE=${SOC_TRIAGE:-off}
      - SOC_TRIAGE_MODEL=${SOC_TRIAGE_MODEL:-claude-sonnet-5-5}
      - SOC_TRIAGE_MAX_PER_HOUR=${SOC_TRIAGE_MAX_PER_HOUR:-20}
      - SOC_ASK_MAX_PER_HOUR=${SOC_ASK_MAX_PER_HOUR:-10}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Threat intelligence (v0.6): public feeds, matched locally. ThreatFox
      # only runs when ABUSECH_AUTH_KEY is set (in secrets.env).
      - SOC_INTEL=${SOC_INTEL:-off}
      - SOC_INTEL_FEEDS=${SOC_INTEL_FEEDS:-feodo,spamhaus_drop,spamhaus_drop_v6,tor_exits,blocklist_de,threatfox}
      - ABUSECH_AUTH_KEY=${ABUSECH_AUTH_KEY:-}
      # Talon OT (FRCS assessments). Prod default is OFF. Its data lives in
      # its own folder inside the data volume (/app/data/ot), never in the
      # Talon DB. OT_SETUP_CODE (secrets.env) guards first-run admin setup.
      # SOC alerts (ADR 0008): ntfy push + Slack. Prod default OFF. Topic,
      # webhook and ack secret come from secrets.env. See docs/SOC-ALERTS.md.
      - SOC_ALERTS=${SOC_ALERTS:-off}
      - SOC_NTFY_URL=${SOC_NTFY_URL:-https://ntfy.sh}
      - SOC_NTFY_TOPIC=${SOC_NTFY_TOPIC:-}
      - SOC_NTFY_TOKEN=${SOC_NTFY_TOKEN:-}
      - SOC_SLACK_WEBHOOK=${SOC_SLACK_WEBHOOK:-}
      - SOC_ALERT_SECRET=${SOC_ALERT_SECRET:-}
      - SOC_ALERT_BASE_URL=${SOC_ALERT_BASE_URL:-http://core:8088}
      - SOC_ALERT_MIN_SEVERITY=${SOC_ALERT_MIN_SEVERITY:-high}
      - SOC_ALERT_QUIET=${SOC_ALERT_QUIET:-}
      - SOC_ALERT_TZ=${SOC_ALERT_TZ:-Asia/Tokyo}
      - SOC_ALERT_RENOTIFY_MIN=${SOC_ALERT_RENOTIFY_MIN:-30}
      - SOC_ALERT_MAX_SENDS=${SOC_ALERT_MAX_SENDS:-3}
      - SOC_ALERT_TRIAGE_WAIT_S=${SOC_ALERT_TRIAGE_WAIT_S:-600}
      - SOC_ALERT_SILENT_MIN=${SOC_ALERT_SILENT_MIN:-30}
      - SOC_ALERT_DETAIL=${SOC_ALERT_DETAIL:-summary}
      - SOC_ALERT_LANG=${SOC_ALERT_LANG:-en}
      - OT_ENABLED=${OT_ENABLED:-off}
      - OT_DATA_DIR=${OT_DATA_DIR:-/app/data/ot}
      - OT_SETUP_CODE=${OT_SETUP_CODE:-}

  web:
    image: nginx:alpine
    container_name: ${STACK_NAME:-eagle-talon}-web
    restart: unless-stopped
    network_mode: host
    environment:
      - NGINX_PORT=${EAGLE_TALON_WEB_PORT:-8088}
      - API_PORT=${API_PORT:-8000}
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api

volumes:
  # The compose-level key stays "eagle-talon-data"; the real Docker volume
  # name comes from DATA_VOLUME. Prod MUST stay "eagle-talon-data" — Eagle Eye
  # mounts that exact volume. Staging uses its own volume and never touches it.
  eagle-talon-data:
    name: ${DATA_VOLUME:-eagle-talon-data}
